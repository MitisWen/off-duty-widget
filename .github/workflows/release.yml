name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "下班小组件 ${{ github.ref_name }}"
          releaseBody: |
            macOS：下载 `.dmg`（通用包，Intel / Apple Silicon 都能装）。
            Windows：下载 `.exe`（NSIS 安装包）或 `.msi`。

            首次打开如果被系统拦截：
            - macOS：在“应用程序”里右键 App → 打开；若提示“已损坏”，终端执行 `xattr -cr /Applications/off-duty-widget.app`
            - Windows：SmartScreen 里点“更多信息” → “仍要运行”

            macOS 包未签名/未公证，Windows 包未签名，均属正常。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
